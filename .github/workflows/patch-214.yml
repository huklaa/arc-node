name: Patch Arc 214
on:
  push:
    branches: [fix-214-malachite-suffix-gap]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-214-malachite-suffix-gap
      - name: Update Malachite pin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text()
          old = 'rev = "8ee5d998"'
          assert s.count(old) == 13, s.count(old)
          p.write_text(s.replace(old, 'rev = "378b0e5"'))
          PY
          cargo update -p arc-malachitebft-sync
      - name: Validate consensus build
        run: cargo build -p arc-node-consensus --locked
      - name: Verify diff scope
        shell: bash
        run: |
          git diff --check
          git diff -- Cargo.toml Cargo.lock
          test -z "$(git status --porcelain | grep -vE '^( M|M ) (Cargo.toml|Cargo.lock)$')"
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "fix(sync): pull Malachite suffix-gap fix"
          git push origin HEAD:fix-214-malachite-suffix-gap
